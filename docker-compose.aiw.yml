# =============================================================================
# AIW Code Agent deployment — isolated from upstream docker-compose.yml
# =============================================================================
# Differences from the upstream compose:
#   - container names prefixed with aiw-
#   - dedicated network (aiw-code-agent-net)
#   - dedicated volumes (aiw-*)
#   - non-conflicting host port 8090 (avoids the stock 8080)
#   - host.docker.internal wired so the agent container can reach the LiteLLM
#     gateway running on the host (LITELLM_GATEWAY_URL=http://host.docker.internal:4000
#     or the tailnet address, whichever is cheaper)
#   - env_file: .env (generated by scripts/aiw-fetch-secrets.sh from Bitwarden)
#
# Usage:
#   ./scripts/aiw-fetch-secrets.sh > .env
#   docker compose -f docker-compose.aiw.yml up -d --build
#   docker compose -f docker-compose.aiw.yml logs -f app
#
# Smoke test:
#   curl -H "X-API-Key: $API_KEY" http://localhost:8090/api/health
#
# Tear down:
#   docker compose -f docker-compose.aiw.yml down
#   docker compose -f docker-compose.aiw.yml down --volumes   # nuke DB too

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-whisperers/code-agent:aiw-dev
    container_name: aiw-code-agent
    env_file: .env
    environment:
      # Force the DB URL to reach the postgres service by name inside the compose network
      DATABASE_URL: jdbc:postgresql://aiw-code-agent-db:5432/aiw_code_agent
      DATABASE_USER: ${DATABASE_USER:-aiw_code_agent}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-aiw_code_agent}
      # Keycloak disabled for dev — we'll flip this when integration:supabase-auth lands
      KEYCLOAK_ENABLED: "false"
      # Quarkus log level — verbose on first boot so we can see what's happening
      QUARKUS_LOG_LEVEL: "INFO"
      QUARKUS_LOG_CATEGORY__COM_ENEVE_AGENT__LEVEL: "DEBUG"
    ports:
      - "8090:8080"
    volumes:
      - aiw-m2:/home/appuser/.m2
      - aiw-workspace:/workspace
    # So the agent container can reach the LiteLLM gateway on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aiw-code-agent-net

  postgres:
    # pgvector/pgvector:pg16 is postgres 16 + pgvector extension preinstalled.
    # Upstream docker-compose.yml uses plain postgres:16-alpine which doesn't
    # include pgvector, so migration V12 (create code embeddings) fails with
    # "extension vector is not available". We need pgvector for the agent's
    # code-graph embeddings + knowledge search.
    image: pgvector/pgvector:pg16
    container_name: aiw-code-agent-db
    environment:
      POSTGRES_DB: aiw_code_agent
      POSTGRES_USER: ${DATABASE_USER:-aiw_code_agent}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-aiw_code_agent}
    volumes:
      - aiw-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-aiw_code_agent} -d aiw_code_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - aiw-code-agent-net
    # No port published to host — only reachable from the app container.

volumes:
  aiw-m2:
  aiw-pg:
  aiw-workspace:

networks:
  aiw-code-agent-net:
    name: aiw-code-agent-net
