# =============================================================================
# Code Agent Runner - Configuration
# =============================================================================
# All secrets should be provided via environment variables in production.
# This file documents every available setting with its default value.

# --- AI / Claude ---
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.fast-model=${ANTHROPIC_FAST_MODEL:claude-3-5-haiku-20241022}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:8192}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
# Pricing (USD per million tokens, for cost estimation)
anthropic.pricing.cache-read-per-million=${ANTHROPIC_PRICING_CACHE_READ:0.30}
anthropic.pricing.cache-write-per-million=${ANTHROPIC_PRICING_CACHE_WRITE:3.75}
anthropic.pricing.input-per-million=${ANTHROPIC_PRICING_INPUT:3.0}
anthropic.pricing.output-per-million=${ANTHROPIC_PRICING_OUTPUT:15.0}
# Rate-limit budget (proactive throttling to avoid 429 backoff penalties)
# Tier 1=40000, Tier 2=80000, Tier 3=160000, Tier 4=400000 tokens/min
anthropic.rate-limit.safety-margin=${ANTHROPIC_RATE_LIMIT_SAFETY_MARGIN:0.80}
anthropic.rate-limit.tokens-per-minute=${ANTHROPIC_TOKENS_PER_MINUTE:450000}

# --- Voyage AI (Embeddings) ---
# Vector indexing is controlled per-repo via repo_settings.vector_enabled (default: false).
embedding.max-source-chars=${EMBEDDING_MAX_SOURCE_CHARS:16000}
voyage.api.key=${VOYAGE_API_KEY:}
voyage.batch-size=${VOYAGE_BATCH_SIZE:128}
voyage.model=${VOYAGE_MODEL:voyage-code-3}

# --- Git Platform ---
# Supported values: bitbucket, azuredevops, gitlab, github
git.author.email=${GIT_AUTHOR_EMAIL:-}
git.author.name=${GIT_AUTHOR_NAME:code-agent}
git.password=${GIT_PASSWORD:${bitbucket.app.password}}
git.platform=${GIT_PLATFORM:bitbucket}
git.username=${GIT_USERNAME:${bitbucket.user}}

# --- Bitbucket Cloud ---
bitbucket.app.password=${BITBUCKET_APP_PASSWORD:}
bitbucket.base.url=${BITBUCKET_BASE_URL:https://api.bitbucket.org/2.0}
bitbucket.user=${BITBUCKET_USER:}
bitbucket.workspace=${BITBUCKET_WORKSPACE:}

# --- Azure DevOps ---
azuredevops.agent.user=${AZUREDEVOPS_AGENT_USER:}
azuredevops.base.url=${AZUREDEVOPS_BASE_URL:https://dev.azure.com}
azuredevops.pat=${AZUREDEVOPS_PAT:}

# --- GitLab ---
gitlab.agent.user=${GITLAB_AGENT_USER:}
gitlab.base.url=${GITLAB_BASE_URL:https://gitlab.com/api/v4}
gitlab.token=${GITLAB_TOKEN:}

# --- GitHub ---
github.agent.user=${GITHUB_AGENT_USER:}
github.base.url=${GITHUB_BASE_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}

# --- JIRA ---
jira.agent.assignee=${JIRA_AGENT_ASSIGNEE:-}
jira.agent.default-repo-url=${JIRA_AGENT_DEFAULT_REPO_URL:-}
jira.agent.label=${JIRA_AGENT_LABEL:WALL-E}
jira.api.token=${JIRA_API_TOKEN:}
jira.base.url=${JIRA_BASE_URL:https://yourorg.atlassian.net}
# Custom field IDs for billing shortcuts in jira_create_issue (leave blank if not used)
jira.billing-category-field=${JIRA_BILLING_CATEGORY_FIELD:-}
jira.billing-code-field=${JIRA_BILLING_CODE_FIELD:-}
jira.default.worklog=${JIRA_DEFAULT_WORKLOG:30m}
jira.transition.done=${JIRA_TRANSITION_DONE:}
jira.transition.in-review=${JIRA_TRANSITION_IN_REVIEW:}
jira.transition.rejected=${JIRA_TRANSITION_REJECTED:}
jira.user=${JIRA_USER:}

# --- Confluence ---
# Used by the publish_confluence tool. Per-repo space key and parent page ID are in repo_settings.
confluence.api.token=${CONFLUENCE_API_TOKEN:}
confluence.base.url=${CONFLUENCE_BASE_URL:}
confluence.user=${CONFLUENCE_USER:}

# --- Aikido Security ---
aikido.base.url=${AIKIDO_BASE_URL:https://app.aikido.dev}
aikido.ci.api.secret=${AIKIDO_CI_API_SECRET:-}
aikido.client.id=${AIKIDO_CLIENT_ID:-}
aikido.client.secret=${AIKIDO_CLIENT_SECRET:-}

# --- AWS Tools (CloudWatch, ECS, Metrics) ---
# Cross-account access via STS AssumeRole (iamRole per product environment).
# The ECS task role needs sts:AssumeRole on arn:aws:iam::*:role/agent-readonly.
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.region=${AWS_REGION:eu-central-1}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
tools.aws.enabled=${TOOLS_AWS_ENABLED:true}

# --- S3 / Attachments ---
attachment.s3.bucket=${ATTACHMENT_S3_BUCKET:code-agent-attachments}
quarkus.s3.aws.credentials.type=default
quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.endpoint-override=${AWS_ENDPOINT_OVERRIDE:}
# Local development with LocalStack
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%dev.quarkus.s3.endpoint-override=http://localhost:4566
%dev.quarkus.s3.path-style-access=true

# --- Notifications ---
agent.base.url=${AGENT_BASE_URL:}
n8n.webhook.url=${N8N_WEBHOOK_URL:-}
teams.webhook.url=${TEAMS_WEBHOOK_URL:-}

# --- Cursor Rules ---
rules.auto-read-target-repo=${RULES_AUTO_READ_TARGET_REPO:true}
rules.repo.cache.dir=${RULES_REPO_CACHE_DIR:/tmp/cursor-rules-cache}
rules.repo.url=${RULES_REPO_URL:-}

# --- Security ---
# Shared API key (X-API-Key header). Leave blank to disable.
api.key=${API_KEY:}
# Lock CORS to the known frontend origin(s). Separate multiple origins with a comma.
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Master encryption key for agent_settings table secrets (64-char hex / 32 bytes).
# Generate: openssl rand -hex 32. Leave blank to keep secrets in env vars only.
settings.cache.ttl-seconds=${SETTINGS_CACHE_TTL:30}
settings.encryption.key=${SETTINGS_ENCRYPTION_KEY:}
# Webhook HMAC-SHA256 secrets — leave blank to disable verification.
webhook.secret.aikido=${WEBHOOK_SECRET_AIKIDO:}
webhook.secret.azuredevops=${WEBHOOK_SECRET_AZUREDEVOPS:}
webhook.secret.bitbucket=${WEBHOOK_SECRET_BITBUCKET:}
webhook.secret.github=${WEBHOOK_SECRET_GITHUB:}
webhook.secret.gitlab=${WEBHOOK_SECRET_GITLAB:}
webhook.secret.jira=${WEBHOOK_SECRET_JIRA:}
# Set to false to skip startup webhook reconciliation (recommended in dev to avoid touching production Bitbucket).
bitbucket.webhook.sync.enabled=${BITBUCKET_WEBHOOK_SYNC_ENABLED:true}
%dev.bitbucket.webhook.sync.enabled=false

# --- Keycloak OIDC ---
# Set KEYCLOAK_ENABLED=true to activate OIDC bearer token validation.
quarkus.http.auth.proactive=false
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:https://sso.example.com}/auth/realms/${KEYCLOAK_REALM:code-agent}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:code-agent-api}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:your-default-secret}
quarkus.oidc.tenant-enabled=${KEYCLOAK_ENABLED:true}
# Include both realm roles and client roles in SecurityIdentity so @RolesAllowed works for either setup
quarkus.oidc.roles.role-claim-path=realm_access/roles,resource_access/${KEYCLOAK_CLIENT_ID:code-agent-api}/roles

# --- Knowledge Indexer ---
knowledge.indexer.jira-max-results=${KNOWLEDGE_INDEXER_JIRA_MAX_RESULTS:200}
knowledge.indexer.max-attachment-bytes=${KNOWLEDGE_INDEXER_MAX_ATTACHMENT_BYTES:5242880}

# --- Web Docs Crawler ---
# Scheduler cron and timezone are startup-only (used in @Scheduled annotation expressions).
# All other settings are read at runtime via SettingsService and can be overridden in agent_settings DB.
knowledge.crawler.scheduler.cron=${KNOWLEDGE_CRAWLER_SCHEDULER_CRON:0 0 22 ? * FRI *}
knowledge.crawler.scheduler.timezone=${KNOWLEDGE_CRAWLER_SCHEDULER_TIMEZONE:Europe/Amsterdam}
# Runtime-tunable via SettingsService (default: off)
knowledge.crawler.scheduler.enabled=${KNOWLEDGE_CRAWLER_SCHEDULER_ENABLED:false}
knowledge.crawler.global-max-pages=${KNOWLEDGE_CRAWLER_GLOBAL_MAX_PAGES:2000}
knowledge.crawler.user-agent=${KNOWLEDGE_CRAWLER_USER_AGENT:code-agent-bot/1.0}
knowledge.crawler.connect-timeout-ms=${KNOWLEDGE_CRAWLER_CONNECT_TIMEOUT_MS:5000}

# --- Code Graph ---
# Cross-repo: impact analysis and query_code_graph search other repos in the workspace.
code-graph.cross-repo.critical-threshold=${CODE_GRAPH_CROSS_REPO_CRITICAL_THRESHOLD:3}
code-graph.cross-repo.enabled=${CODE_GRAPH_CROSS_REPO_ENABLED:true}
# Scheduler: pre-builds code graphs for repos that don't have one yet (runs every 6h).
code-graph.scheduler.clone-timeout-minutes=${CODE_GRAPH_SCHEDULER_CLONE_TIMEOUT:10}
code-graph.scheduler.default-branch=${CODE_GRAPH_SCHEDULER_DEFAULT_BRANCH:main}
code-graph.scheduler.enabled=${CODE_GRAPH_SCHEDULER_ENABLED:true}

# --- Quality Reports ---
# Daily snapshots per repo (opt-in via quality_report_enabled=true in repo_settings).
quality-report.branches=${QUALITY_REPORT_BRANCHES:main,develop}
quality-report.cc-threshold=${QUALITY_REPORT_CC_THRESHOLD:10}
quality-report.coverage.enabled=${QUALITY_REPORT_COVERAGE_ENABLED:true}
quality-report.jacoco.version=${QUALITY_REPORT_JACOCO_VERSION:0.8.12}
quality-report.job-timeout-minutes=${QUALITY_REPORT_JOB_TIMEOUT_MINUTES:30}
quality-report.scheduler.enabled=${QUALITY_REPORT_SCHEDULER_ENABLED:false}

# --- Upgrade Scheduler ---
# Checks for outdated versions daily; creates auto-executing upgrade plans (opt-in).
upgrade.scheduler.default-branch=${UPGRADE_SCHEDULER_DEFAULT_BRANCH:develop}
upgrade.scheduler.enabled=${UPGRADE_SCHEDULER_ENABLED:false}
upgrade.scheduler.version-cache-minutes=${UPGRADE_VERSION_CACHE_MINUTES:60}

# --- Code Metrics ---
metrics.cc-threshold=${METRICS_CC_THRESHOLD:10}
metrics.job-timeout-minutes=${METRICS_JOB_TIMEOUT_MINUTES:30}
metrics.max-iterations=${METRICS_MAX_ITERATIONS:3}
metrics.max-methods-per-fix=${METRICS_MAX_METHODS_PER_FIX:10}

# --- Linter / SAST ---
linter.checkstyle.enabled=${LINTER_CHECKSTYLE_ENABLED:true}
linter.dotnet-format.enabled=${LINTER_DOTNET_FORMAT_ENABLED:true}
linter.enabled=${LINTER_ENABLED:true}
linter.eslint.enabled=${LINTER_ESLINT_ENABLED:true}
linter.fail-on-new-issues=${LINTER_FAIL_ON_NEW_ISSUES:false}
linter.line-tolerance=${LINTER_LINE_TOLERANCE:5}
linter.max-fix-iterations=${LINTER_MAX_FIX_ITERATIONS:2}
linter.phpstan.enabled=${LINTER_PHPSTAN_ENABLED:true}
linter.pmd.enabled=${LINTER_PMD_ENABLED:true}
linter.report-on-pr=${LINTER_REPORT_ON_PR:true}
linter.scope-to-changed-files=${LINTER_SCOPE_TO_CHANGED_FILES:true}
linter.spotbugs.enabled=${LINTER_SPOTBUGS_ENABLED:true}
linter.timeout-minutes=${LINTER_TIMEOUT_MINUTES:10}

# --- Planner ---
planner.enabled=${PLANNER_ENABLED:true}
planner.max-tokens=${PLANNER_MAX_TOKENS:8192}

# --- PR Review ---
pr.summary.diagram.upload.enabled=${PR_SUMMARY_DIAGRAM_UPLOAD_ENABLED:true}
review.pr-summary.enabled=${REVIEW_PR_SUMMARY_ENABLED:true}
review.sequence-diagrams.enabled=${REVIEW_SEQUENCE_DIAGRAMS_ENABLED:true}
review.webhook.skip-authors=${REVIEW_WEBHOOK_SKIP_AUTHORS:code-agent}

# --- Agent Behaviour ---
# Build JDK override — leave blank to use the server's default JDK.
build.java-home=${BUILD_JAVA_HOME:}
generate-docs.max-loop-iterations=${GENERATE_DOCS_MAX_LOOP_ITERATIONS:200}
generate-tests.job-timeout-minutes=${GENERATE_TESTS_JOB_TIMEOUT_MINUTES:60}
generate-tests.max-loop-iterations=${GENERATE_TESTS_MAX_LOOP_ITERATIONS:500}
run-fix.allowed-commands=${RUN_FIX_ALLOWED_COMMANDS:mvn,./mvnw,git diff,git status,git log,ls,find,cat,grep,dotnet,npm,npx}
run-fix.blocked-paths=${RUN_FIX_BLOCKED_PATHS:src/main/security,src/main/billing,.github,.env}
run-fix.job-timeout-minutes=${RUN_FIX_JOB_TIMEOUT_MINUTES:30}
run-fix.max-build-retries=${RUN_FIX_MAX_BUILD_RETRIES:2}
run-fix.max-concurrent-jobs=${RUN_FIX_MAX_CONCURRENT_JOBS:3}
run-fix.max-files-changed=${RUN_FIX_MAX_FILES_CHANGED:10}
run-fix.max-lines-changed=${RUN_FIX_MAX_LINES_CHANGED:500}
run-fix.max-loop-iterations=${RUN_FIX_MAX_LOOP_ITERATIONS:150}
run-fix.max-queue-size=${RUN_FIX_MAX_QUEUE_SIZE:20}
run-fix.self-review.enabled=${RUN_FIX_SELF_REVIEW_ENABLED:true}
run-fix.self-review.max-diff-chars=${RUN_FIX_SELF_REVIEW_MAX_DIFF_CHARS:30000}
run-fix.self-review.max-iterations=${RUN_FIX_SELF_REVIEW_MAX_ITERATIONS:15}
tools.fetch-url.allowed-domains=${TOOLS_FETCH_URL_ALLOWED_DOMAINS:}
tools.fetch-url.enabled=${TOOLS_FETCH_URL_ENABLED:true}
tools.fetch-url.timeout-seconds=${TOOLS_FETCH_URL_TIMEOUT:15}

# --- PostgreSQL ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/code_agent}
quarkus.datasource.password=${DATABASE_PASSWORD:}
quarkus.datasource.username=${DATABASE_USER:code_agent}
quarkus.flyway.migrate-at-start=true

# --- Quarkus ---
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.enabled=true
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.headers=Authorization,Content-Type,X-API-Key
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.port=8080
quarkus.log.category."com.eneve.agent".level=DEBUG
quarkus.log.level=INFO
quarkus.rest.path=/api
# Vert.x blocked-thread threshold — must exceed clone timeout + indexing time.
quarkus.vertx.max-worker-execute-time=15m

# --- OpenAPI / Swagger UI ---
mp.openapi.filter=com.eneve.agent.security.OpenApiSecurityFilter
quarkus.smallrye-openapi.info-contact-name=Code Agent Team
quarkus.smallrye-openapi.info-description=Self-hosted coding agent that automates issue fixing and dependency upgrades. Clones repos, runs an AI tool-use loop, validates with Maven, creates PRs, and updates JIRA.
quarkus.smallrye-openapi.info-title=Code Agent Runner API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.oauth-client-id=${KEYCLOAK_CLIENT_ID:code-agent-ui}
quarkus.swagger-ui.oauth-scopes=openid email profile
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true
quarkus.swagger-ui.oauth2-redirect-url=/q/swagger-ui/oauth2-redirect.html
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.theme=flattop


