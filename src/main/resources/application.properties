# =============================================================================
# Code Agent Runner - Configuration
# =============================================================================
# All secrets should be provided via environment variables in production.
# This file contains defaults and documentation of available keys.

# --- Anthropic (Claude) ---
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:8192}

# --- JIRA Cloud ---
jira.base.url=${JIRA_BASE_URL:https://eneve.atlassian.net}
jira.user=${JIRA_USER:}
jira.api.token=${JIRA_API_TOKEN:}
jira.transition.in-review=${JIRA_TRANSITION_IN_REVIEW:}
jira.transition.done=${JIRA_TRANSITION_DONE:}
jira.transition.rejected=${JIRA_TRANSITION_REJECTED:}
jira.default.worklog=${JIRA_DEFAULT_WORKLOG:30m}

# --- JIRA Webhook / Agent User ---
jira.agent.assignee=${JIRA_AGENT_ASSIGNEE:-}
jira.agent.default-repo-url=${JIRA_AGENT_DEFAULT_REPO_URL:-}

# --- Bitbucket Cloud ---
bitbucket.base.url=${BITBUCKET_BASE_URL:https://api.bitbucket.org/2.0}
bitbucket.workspace=${BITBUCKET_WORKSPACE:}
bitbucket.user=${BITBUCKET_USER:}
bitbucket.app.password=${BITBUCKET_APP_PASSWORD:}

# --- Git (defaults to Bitbucket credentials if not set) ---
git.username=${GIT_USERNAME:${bitbucket.user}}
git.password=${GIT_PASSWORD:${bitbucket.app.password}}
git.author.name=${GIT_AUTHOR_NAME:code-agent}
git.author.email=${GIT_AUTHOR_EMAIL:-}

# --- Microsoft Teams (one-way webhook, v1) ---
teams.webhook.url=${TEAMS_WEBHOOK_URL:-}

# --- n8n ---
n8n.webhook.url=${N8N_WEBHOOK_URL:-}

# --- Cursor Rules ---
rules.repo.url=${RULES_REPO_URL:-}
rules.repo.cache.dir=${RULES_REPO_CACHE_DIR:/tmp/cursor-rules-cache}
rules.auto-read-target-repo=${RULES_AUTO_READ_TARGET_REPO:true}

# --- Aikido Security ---
aikido.base.url=${AIKIDO_BASE_URL:https://app.aikido.dev}
aikido.client.id=${AIKIDO_CLIENT_ID:-}
aikido.client.secret=${AIKIDO_CLIENT_SECRET:-}
aikido.ci.api.secret=${AIKIDO_CI_API_SECRET:-}

# --- Job Queue ---
run-fix.max-concurrent-jobs=${RUN_FIX_MAX_CONCURRENT_JOBS:3}
run-fix.max-queue-size=${RUN_FIX_MAX_QUEUE_SIZE:20}

# --- Agent Guardrails ---
run-fix.blocked-paths=${RUN_FIX_BLOCKED_PATHS:src/main/security,src/main/billing,.github,.env}
run-fix.allowed-commands=${RUN_FIX_ALLOWED_COMMANDS:mvn,git diff,git status,ls,find,cat}
run-fix.max-files-changed=${RUN_FIX_MAX_FILES_CHANGED:10}
run-fix.max-lines-changed=${RUN_FIX_MAX_LINES_CHANGED:500}
run-fix.max-loop-iterations=${RUN_FIX_MAX_LOOP_ITERATIONS:50}
run-fix.job-timeout-minutes=${RUN_FIX_JOB_TIMEOUT_MINUTES:30}

# --- Quarkus ---
quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.category."com.eneve.agent".level=DEBUG

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.info-title=Code Agent Runner API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Self-hosted coding agent that automates issue fixing and dependency upgrades. Clones repos, runs an AI tool-use loop, validates with Maven, creates Bitbucket PRs, and updates JIRA.
quarkus.smallrye-openapi.info-contact-name=Code Agent Team
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.theme=flattop
